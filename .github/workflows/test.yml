name: MES business rules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mes_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d mes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test_ci_only@localhost:5432/mes_test
      - run: node --check app/static/app.js
